name: ssq-tool

services:
  app:
    # 本地开发：用当前目录的 Dockerfile 构建本地镜像
    build: .
    image: ssq:local
    ports:
      - "8081:80"
    volumes:
      - ssq-private:/app/private
    environment:
      TZ: Asia/Shanghai
      BARK_KEY: ${BARK_KEY}
      BARK_SOUND: ${BARK_SOUND:-minuet}
      SSQ_ADMIN_TOKEN: ${SSQ_ADMIN_TOKEN}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_DAILY_LIMIT: ${DEEPSEEK_DAILY_LIMIT:-50}
      DEEPSEEK_MIN_INTERVAL: ${DEEPSEEK_MIN_INTERVAL:-2}
    restart: unless-stopped

volumes:
  ssq-private:
