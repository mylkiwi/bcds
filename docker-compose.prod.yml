name: ssq-tool

services:
  app:
    # 生产环境：直接拉取已发布的镜像，无需本地构建
    image: registry.cn-hangzhou.aliyuncs.com/ityadong/ssq:latest
    # 每次启动时拉取最新镜像
    pull_policy: always
    ports:
      - "8081:80"
    environment:
      TZ: Asia/Shanghai
      BARK_KEY: ${BARK_KEY}
      BARK_SOUND: ${BARK_SOUND:-minuet}
      SSQ_ADMIN_TOKEN: ${SSQ_ADMIN_TOKEN}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_DAILY_LIMIT: ${DEEPSEEK_DAILY_LIMIT:-50}
      DEEPSEEK_MIN_INTERVAL: ${DEEPSEEK_MIN_INTERVAL:-2}
    restart: unless-stopped
